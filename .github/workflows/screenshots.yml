# Levanta un emulador Android, instala la app, la recorre y publica capturas de pantalla
# en el Release "screenshots". Corre al cambiar la UI o a mano (Actions → Screenshots → Run workflow).
name: Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/screenshots.sh"
      - ".github/workflows/screenshots.yml"
      - "app/src/main/java/**/ui/**"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: ./gradlew assembleRelease

      # Aceleración por hardware para que el emulador sea usable.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + recorrido de la app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png

      - name: Publicar capturas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          gh release delete screenshots --cleanup-tag --yes || true
          gh release create screenshots screenshots/*.png \
            --target "$GITHUB_SHA" --prerelease \
            --title "Capturas de pantalla (${GITHUB_SHA::7})" \
            --notes "Capturas tomadas automáticamente en un emulador Pixel 7 (Android 14)."
